# Pipeline settings; config.local.toml and NAME=value command arguments override these.
DATA_ROOT = "data"
BASEMAP_MINZOOM = 0
BASEMAP_MAXZOOM = 14
PLANETILER_IMAGE = "sunoh-planetiler:0.10.2"
PLANETILER_HEAP = "64g"
PLANETILER_DOCKER_ARGS = "--cpus=28 --memory=96g"
PLANETILER_ARGS = "--threads=28 --compress-temp=true"

# Snakemake scheduling; tool-specific thread counts remain below.
CORES = 28
MEM_MB = 98304
TERRAIN_DOWNLOAD_WORKERS = 4
TERRAIN_DOWNLOAD_LIMIT = 0
TERRAIN_PROCESS_WORKERS = 2
TERRAIN_BATCH_LIMIT = 0
TERRAIN_BBOX = ""
TERRAIN_TILE_MAXZOOM = 14
TERRAIN_TILE_SIMPLIFICATION = 2.0
TERRAIN_TILE_THREADS = 16
CONTOUR_INTERVAL = 50
INDEX_INTERVAL = 250
HILLSHADE_BANDS = "shadow:56:0:60 shadow:67:60:100 shadow:78:100:135 highlight:89:220:230 highlight:94:230:256"

OSM_URL = "https://planet.openstreetmap.org/pbf/planet-latest.osm.pbf"
NOTO_SANS_URL = "https://github.com/notofonts/notofonts.github.io/raw/main/fonts/NotoSans/hinted/ttf"
# OSM_PBF, FONT_TTFS and PLANETILER_TMP_DIR default to their DATA_ROOT stages.
